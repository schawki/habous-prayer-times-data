name: Mise à jour des données Habous

on:
  # Volontairement MANUEL : rien n'est lu sur habous.gov.ma tant que vous ne lancez pas
  # ce workflow. Pour l'automatiser (une fois l'autorisation des Habous réglée),
  # décommentez le bloc schedule. Le script ne contacte le site pour une ville que si
  # ses données expirent dans moins de --lookahead jours : en pratique ~1 passage par
  # mois hijri, même si le déclenchement est hebdomadaire.
  workflow_dispatch:
    inputs:
      city:
        description: "Essai : ne traiter que cette ville (id Habous, ex. 58). Vide = toutes."
        required: false
        default: ""
      utc_offset:
        description: 'Décalage UTC à écrire dans les fichiers, ex. +00:00 (facultatif)'
        required: false
        default: ""
  # schedule:
  #   - cron: "17 5 * * 1"   # chaque lundi ; ne lit le site que si les données expirent bientôt

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire les données
        env:
          CITY: ${{ inputs.city }}
          UTC_OFFSET: ${{ inputs.utc_offset }}
        run: |
          args=(--data-dir data --lookahead 7 --ca-bundle certs/habous-intermediate.pem)
          [ -n "$CITY" ] && args+=(--city "$CITY")
          [ -n "$UTC_OFFSET" ] && args+=(--utc-offset "$UTC_OFFSET")
          python tools/build_data.py "${args[@]}"
      - name: Publier si modifié
        run: |
          git config user.name "habous-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des horaires"
          git push
