name: Mise à jour des données Habous

on:
  # Passage quotidien, mais presque toujours sans effet : le script regarde d'abord dans
  # data/ si tous les fichiers couvrent encore aujourd'hui (--skip-if-fresh) et s'arrête alors
  # sans contacter le site Habous. Une passe complète (liste des villes + 191 horaires, ~13 min)
  # n'a lieu qu'au changement de mois hijri. Lancement manuel toujours possible.
  schedule:
    - cron: "7 0 * * *"
  workflow_dispatch:
    inputs:
      city:
        description: "Essai : ne traiter que cette ville (id Habous, ex. 58). Vide = toutes."
        required: false
        default: ""
      utc_offset:
        description: 'Impose le décalage UTC, ex. +00:00. Vide = déduit automatiquement (recommandé).'
        required: false
        default: ""

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Construire les données
        env:
          CITY: ${{ inputs.city }}
          UTC_OFFSET: ${{ inputs.utc_offset }}
          EVENT: ${{ github.event_name }}
        run: |
          args=(--data-dir data --ca-bundle certs/habous-intermediate.pem)
          if [ "$EVENT" = "schedule" ]; then
            # Automatique : seulement si les données ne couvrent plus aujourd'hui, sans géocodage.
            args+=(--lookahead 0 --skip-if-fresh --no-geocode)
          else
            args+=(--lookahead 7)
          fi
          [ -n "$CITY" ] && args+=(--city "$CITY")
          [ -n "$UTC_OFFSET" ] && args+=(--utc-offset "$UTC_OFFSET")
          python tools/build_data.py "${args[@]}"
      - name: Publier si modifié
        run: |
          git config user.name "habous-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data
          git diff --cached --quiet || git commit -m "Mise à jour des horaires"
          git push
